  type: "conference"
  status: "accepted"
  doi: ""
  pdfUrl: ""
  codeUrl: ""
  abstract: "Agricultural disease diagnosis suffers from extreme class imbalance under uncontrolled ambient lighting and real-field occlusions. We propose a class-weighted ResNet50 framework combined with Grad-CAM visual interpretability to isolate early-stage foliar lesions without synthetic oversampling artefacts."
